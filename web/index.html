<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird - World Model</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #1a1a2e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #fff;
      }

      #container {
        text-align: center;
      }

      h1 {
        margin-bottom: 1rem;
        font-size: 1.5rem;
        color: #4ecdc4;
      }

      #game-canvas {
        border: 2px solid #4ecdc4;
        border-radius: 8px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #status {
        margin-top: 1rem;
        font-size: 0.9rem;
        color: #888;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }

      #loading-bar-container {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 1rem;
      }

      #loading-bar {
        height: 100%;
        background: linear-gradient(90deg, #4ecdc4, #44a08d);
        width: 0%;
        transition: width 0.3s ease;
      }

      #loading-text {
        margin-top: 0.5rem;
        font-size: 0.8rem;
        color: #888;
      }

      #controls {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #666;
      }

      #fps {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 0.8rem;
        color: #4ecdc4;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h2>Loading World Model</h2>
      <div id="loading-bar-container">
        <div id="loading-bar"></div>
      </div>
      <div id="loading-text">Initializing...</div>
    </div>

    <div id="container" class="hidden">
      <h1>Flappy Bird - Neural World Model</h1>
      <canvas id="game-canvas" width="432" height="432"></canvas>
      <div id="status">Press SPACE to flap</div>
      <div id="controls">
        SPACE = Flap | R = Reset | +/- = Adjust Steps
      </div>
    </div>

    <div id="fps"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
